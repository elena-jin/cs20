<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        body {
            background-color: #213575;
        }

        .header p {
            color: #c7d2fe;
            font-size: 1rem;
        }

        .add-movie-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid black;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .add-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .add-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .add-input:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.15);
        }

        .add-btn {
            padding: 12px 32px;
            background: black;
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #989898;
        }

        .watchlist {
            list-style: none;
        }

        .goto-btn{
            background:green;
        }

        .movie-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid black;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: move;
            transition: all 0.3s;
        }

        .movie-item:hover {
            background: black;
        }
        
        .drag-handle {
            font-size: 1.5rem;
            cursor: grab;
            user-select: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .movie-content {
            flex: 1;
        }

        .movie-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .movie-year {
            color: #c7d2fe;
            font-size: 0.875rem;
        }

        .movie-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .delete-btn {
            background: rgb(131, 41, 41);
        }

        .delete-btn:hover {
            background: rgb(145, 31, 31);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed gray;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 1.125rem;
            color: #c7d2fe;
            margin-bottom: 8px;
        }

        .count {
            padding: 12px 24px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Watchlist</h1>
            <p>Keep track of your next watch</p><br>
        </div>

        <div class="add-movie-section">
            <form class="add-form" id="add-form">
                <div class="form-row">
                    <input 
                        type="text" 
                        class="add-input" 
                        id="movie-title" 
                        placeholder="Movie title"
                        required
                    >
                </div>
                <button type="submit" class="add-btn"> Add Movie</button>
            </form>
        </div>

        <div class="count" id="movie-count">0 movies in your watchlist</div>

        <ul class="watchlist" id="watchlist"></ul>
    </div>

    <script>
        let watchlist = [];
        let draggedElement = null;

        const exampleMovies = [
            { title: "The Shawshank Redemption", id: 1},
            { title: "Avatar 3", id: 2},
            { title: "Interstellar", id: 3}
        ];

        function loadWatchlist() {
            try {
                const data = localStorage.getItem('movie-watchlist');
                if (data) {
                    watchlist = JSON.parse(data);
                } else {
                    watchlist = [...exampleMovies];
                    saveWatchlist();
                }
            } catch (error) {
                console.log('No watchlist found, loading examples');
                watchlist = [...exampleMovies];
                saveWatchlist();
            }
            renderWatchlist();
        }

        function saveWatchlist() {
            try {
                localStorage.setItem('movie-watchlist', JSON.stringify(watchlist));
            } catch (error) {
                console.error('Failed to save watchlist:', error);
            }
        }

        function updateCount() {
            const count = watchlist.length;
            document.getElementById('movie-count').textContent = 
                `${count} movie${count !== 1 ? 's' : ''} in your watchlist`;
        }
        function renderWatchlist() {
            const container = document.getElementById('watchlist');
            updateCount();

            if (watchlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <div class="empty-state-text">Your watchlist is empty</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = watchlist.map((movie, index) => `
                <li class="movie-item" draggable="true" data-index="${index}">
                    <span class="drag-handle">⋮⋮</span>
                    <div class="movie-content">
                        <div class="movie-title">${movie.title}</div>
                    </div>
                    <div class="movie-actions">
                        <button class="action-btn goto-btn" onclick="window.location.href='movie.html'">Go to Page</button>
                        <button class="action-btn delete-btn" onclick="deleteMovie(${index})">Delete</button>
                    </div>
                </li>
            `).join('');

            document.querySelectorAll('.movie-item').forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragend', handleDragEnd);
            });
        }

        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('movie-title').value.trim();

            if (title) {
                watchlist.push({ 
                    title,
                    id: Date.now()
                });
                saveWatchlist();
                renderWatchlist();
                e.target.reset();
            }
        });

        function deleteMovie(index) {
            watchlist.splice(index, 1);
            saveWatchlist();
            renderWatchlist();
        }


        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            if (this !== draggedElement) {
                const rect = this.getBoundingClientRect();
                const midpoint = rect.top + rect.height / 2;
                
                if (e.clientY < midpoint) {
                    this.parentNode.insertBefore(draggedElement, this);
                } else {
                    this.parentNode.insertBefore(draggedElement, this.nextSibling);
                }
            }
        }

        function handleDrop(e) {
            e.preventDefault();
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            
            const newOrder = [];
            document.querySelectorAll('.movie-item').forEach(item => {
                const index = parseInt(item.dataset.index);
                newOrder.push(watchlist[index]);
            });
            
            watchlist = newOrder;
            saveWatchlist();
            renderWatchlist();
        }

        loadWatchlist();
    </script>
</body>
</html>
